services:
  nano:
    build:
      context: .
      args:
        JOBS: "${NANO_BUILD_JOBS:-2}"
    image: "${NANO_IMAGE:-blockchain-nano:local}"
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: ${NANO_DOCKER_NOFILE:-65536}
        hard: ${NANO_DOCKER_NOFILE:-65536}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8545:8545"
      - "30303:30303/tcp"
    volumes:
      - nano-data:/var/lib/nano
      - ./deploy/docker/node.json:/etc/nano/node.json:ro
      - ./genesis/testnet.json:/etc/nano/genesis.json:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    command: [run, /etc/nano/genesis.json, /var/lib/nano/chain, /etc/nano/node.json]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent --max-time 5 -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}' http://127.0.0.1:8545 | grep -q '\"result\"'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  nano-data:
